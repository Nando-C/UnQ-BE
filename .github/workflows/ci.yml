name: CI

on:
  push:
    branches: [main, chore/modernization]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # The suite starts its own in-memory MongoDB and mocks every provider,
      # so it needs no secrets (src/tests/env.ts fills the required variables).
      - run: npm test
      - run: npm run build
